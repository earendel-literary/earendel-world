name: Preview EARENDEL redesign demo

on:
  push:
    branches: [earendel-redesign-demo]
    paths:
      - "redesign-demo/**"
      - ".github/workflows/deploy-redesign-demo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign demo branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload redesign demo only
        uses: actions/upload-pages-artifact@v3
        with:
          path: redesign-demo
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
